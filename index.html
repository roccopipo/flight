<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flight to Genoa</title>
  <style>
    :root {
      --bg: #020824;
      --accent: #ffdd57;
      --text: #f5f7ff;
      --secondary: #4da6ff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
      background: radial-gradient(circle at top, #182847 0, var(--bg) 55%);
      color: var(--text);
      overflow: hidden;
    }

    .page {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }

    .page-1 {
      z-index: 10;
    }

    .page-2 {
      display: none;
      z-index: 5;
    }

    h1 {
      font-size: clamp(2.2rem, 4vw, 3.2rem);
      margin-bottom: 1.5rem;
    }

    p.subtitle {
      font-size: 1rem;
      opacity: 0.8;
      margin-bottom: 3rem;
    }

    button {
      padding: 1rem 2.8rem;
      font-size: 1rem;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      background: linear-gradient(135deg, var(--secondary), var(--accent));
      color: #111;
      font-weight: 600;
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.4);
      transition: transform 0.2s ease, box-shadow 0.2s ease,
        filter 0.2s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      filter: brightness(1.05);
    }

    button:active {
      transform: translateY(0);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    /* Avion animé : traverse l'écran en grandissant */
    .plane {
      position: fixed;
      top: 55%;
      left: -20vw;
      transform: translateY(-50%);
      font-size: clamp(2.5rem, 5vw, 3.5rem);
      z-index: 20;
      animation: fly-across 2.5s linear forwards;
      pointer-events: none;
    }

    @keyframes fly-across {
      0% {
        transform: translate(-20vw, -50%) scale(0.7) rotate(8deg);
      }
      100% {
        transform: translate(120vw, -60%) scale(1.6) rotate(8deg);
      }
    }

    /* Particules de drapeaux qui sortent des moteurs */
    .flag-particle {
      position: fixed;
      width: 40px;
      height: 26px;
      z-index: 15;
      pointer-events: none;
      animation: flag-exhaust 1.2s ease-out forwards;
    }

    .flag-particle img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 4px;
      box-shadow: 0 0 8px rgba(0, 0, 0, 0.6);
      animation: flag-spin 0.8s linear infinite;
    }

    @keyframes flag-exhaust {
      0% {
        transform: translate(0, 0) scale(1);
        opacity: 1;
      }
      100% {
        transform: translate(-90px, 40px) scale(0.7);
        opacity: 0;
      }
    }

    @keyframes flag-spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    /* Étoiles de fond */
    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image:
        radial-gradient(circle at 10% 20%, rgba(255, 255, 255, 0.5) 0, transparent 3px),
        radial-gradient(circle at 80% 30%, rgba(255, 255, 255, 0.4) 0, transparent 3px),
        radial-gradient(circle at 30% 80%, rgba(255, 255, 255, 0.35) 0, transparent 3px),
        radial-gradient(circle at 60% 60%, rgba(255, 255, 255, 0.25) 0, transparent 2px);
      opacity: 0.4;
    }
  </style>
</head>
<body>
  <div class="stars" aria-hidden="true"></div>

  <!-- PAGE 1 -->
  <section class="page page-1">
    <h1>Welcome aboard Lorine de Ternay&nbsp;!</h1>
    <p class="subtitle">
      Your boarding has been confirmed. Please review the information about your flight to Gênes.
    </p>
    <button id="see-info-btn">
      See informations about your flight to Gênes
    </button>
  </section>

  <!-- PAGE 2 (vide pour l’instant, tu pourras remplir plus tard) -->
  <section class="page page-2">
    <!-- Future content about the flight will go here -->
  </section>

  <script>
    const button = document.getElementById("see-info-btn");
    const page1 = document.querySelector(".page-1");
    const page2 = document.querySelector(".page-2");

    button.addEventListener("click", () => {
      button.disabled = true;

      // Crée l'avion
      const plane = document.createElement("div");
      plane.className = "plane";
      plane.textContent = "✈️";
      document.body.appendChild(plane);

      // Génère des drapeaux qui sortent des deux moteurs pendant le vol
      const exhaustInterval = setInterval(() => {
        const rect = plane.getBoundingClientRect();

        // Position approximative des deux moteurs (gauche / droite sous l'avion)
        const engineYOffset = rect.height * 0.2;
        const leftEngineX = rect.left + rect.width * 0.2;
        const rightEngineX = rect.right - rect.width * 0.2;
        const engineY = rect.top + engineYOffset;

        createFlagParticle(leftEngineX, engineY);
        createFlagParticle(rightEngineX, engineY);
      }, 120);

      // Quand l'avion a fini son animation
      plane.addEventListener("animationend", () => {
        clearInterval(exhaustInterval);
        plane.remove();
        page1.style.display = "none";
        page2.style.display = "flex";
      });
    });

    function createFlagParticle(x, y) {
      const flag = document.createElement("div");
      flag.className = "flag-particle";

      flag.style.left = x + "px";
      flag.style.top = y + "px";

      const img = document.createElement("img");
      img.src = "albania-flag.png";  // image que tu as ajoutée dans le repo
      img.alt = "Albanian flag";

      flag.appendChild(img);
      document.body.appendChild(flag);

      // Nettoyage après l'animation
      setTimeout(() => flag.remove(), 1400);
    }
  </script>
</body>
</html>
